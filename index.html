<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helion — We give them gravity.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --background:#02040d; --foreground:#ffffff;
  --surface-deep:#030716; --surface-panel:#060c22;
  --accent-900:#030716; --accent-800:#081235; --accent-700:#12266b; --accent-600:#2340b8;
  --accent-500:#3a5cff; --accent-400:#6d8bff; --accent-300:#9fb8ff; --accent-200:#d6e2ff;
  --signal-glow:#ff5fa8; --signal-ring:#ff8fc4;
  --container-pad:2.5rem; --radius-control:0.875rem;
  --shadow-loader-rail:0 0 16px -2px rgb(58 92 255 / 0.9);
  --hero-glass:rgb(0 0 0 / 0.8); --hero-glass-border:rgb(255 255 255 / 0.2);
  --gradient-hero-title:linear-gradient(90deg,#ffffff 0%,rgb(200 214 255 / 0.2) 100%);
  --gradient-hero-title-inv:linear-gradient(90deg,rgb(200 214 255 / 0.2) 0%,#ffffff 100%);
  --gradient-hero-cta:linear-gradient(107deg,#4977ff 0%,#331574 51.442%,#000315 100%);
  --gradient-hero-icon:linear-gradient(120deg,#4977ff 0%,#d2bdff 100%);
  --gradient-service-rule:linear-gradient(90deg,#4564e5 0%,rgb(69 100 229 / 0) 100%);
  --gradient-service-rule-alt:linear-gradient(90deg,rgb(207 186 255 / 0) 0%,#cfbaff 100%);
  --timeline-rail:rgb(120 150 255 / 0.22);
  --gradient-timeline-tick:linear-gradient(180deg,rgb(73 119 255 / 0) 0%,rgb(73 119 255 / 0.55) 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;overflow-x:hidden;overscroll-behavior-y:none;scrollbar-width:none}
::-webkit-scrollbar{display:none}
body{background:var(--background);color:var(--foreground);font-family:'Mulish',sans-serif;font-weight:400;overflow-x:hidden}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
ul{list-style:none}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid #3a5cff;outline-offset:2px}
input{font:inherit;border:none;outline:none}

/* ---------- scene canvas & scrim ---------- */
#scene-wrap{position:fixed;inset:0;width:100vw;height:100vh;width:100lvw;height:100lvh;pointer-events:none;transform:translateZ(0);backface-visibility:hidden;will-change:transform;z-index:0}
#scene-wrap canvas{width:100%;height:100%;display:block}
.scene-overlay{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg, rgb(0 0 0/.5) 0%, rgb(0 0 0/.16) 24%, rgb(0 0 0/0) 42%,
                         rgb(0 0 0/0) 58%, rgb(0 0 0/.14) 78%, rgb(0 0 0/.42) 100%),
  linear-gradient(180deg, rgb(0 0 0/.42) 0%, rgb(0 0 0/0) 22%, rgb(0 0 0/0) 58%,
                          rgb(0 0 0/.38) 82%, rgb(0 0 0/.72) 100%);}
@media (max-width:768px){.scene-overlay{background:
  linear-gradient(180deg, rgb(0 0 0/.5) 0%, rgb(0 0 0/.24) 26%, rgb(0 0 0/.24) 62%,
                          rgb(0 0 0/.5) 86%, rgb(0 0 0/.78) 100%);}}

/* ---------- slides (scroll anchors) ---------- */
main{position:relative}
.slide{position:relative;width:100%}
#hero{height:140vh;height:140svh}
#sitemap{height:140vh;height:140svh}
#timeline{height:320vh;height:320svh;margin-top:300px}
#impact{height:240vh;height:240svh;margin-top:96px}
@media (max-width:855px){#timeline{margin-top:200px}}
@media (max-width:480px){#timeline{margin-top:140px}}

/* ---------- fixed overlays & the 1440x800 frame ---------- */
.overlay{position:fixed;inset:0;overflow:hidden;z-index:10;opacity:0;visibility:hidden;pointer-events:none}
.frame{position:absolute;top:50%;left:50%;width:1440px;height:800px;transform:translate(-50%,-50%)}

/* ---------- loader readout ---------- */
#loader{position:fixed;inset-inline:0;bottom:14vh;display:flex;flex-direction:column;align-items:center;gap:1.375rem;z-index:200;pointer-events:none}
#loader .pct{font-weight:300;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;color:#fff}
#loader .pct-sym{font-size:0.42em;letter-spacing:0.1em;color:rgb(159 184 255 / 0.7);vertical-align:0.55em;margin-left:0.12em}
#loader .load-rail{height:1px;width:min(20rem,56vw);background:rgba(255,255,255,.12);position:relative}
#loader .load-fill{position:absolute;inset:0;background:var(--accent-500);box-shadow:var(--shadow-loader-rail);transform-origin:left;transform:scaleX(0)}

/* ---------- nav ---------- */
#nav{position:fixed;inset-inline:0;top:0;z-index:120;pointer-events:none}
.nav-desktop{position:fixed;left:50%;top:0;transform:translateX(-50%);transform-origin:top center;display:flex;align-items:center;gap:4px;pointer-events:auto}
.nav-rev{opacity:0;will-change:transform,opacity}
.pill{border-radius:32px;border:1px solid var(--hero-glass-border);background:var(--hero-glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.logo-pill{height:43px;padding:12px 24px;display:flex;align-items:center}
.logo-pill button{display:flex;align-items:center}
.logo-pill svg{width:69.038px;height:18.972px}
.links-pill{padding:12px 32px}
.links-pill ul{display:flex;align-items:center;gap:32px}
.links-pill a{font-size:16px;font-weight:400;color:#fff;opacity:.68;display:inline-block;will-change:transform,opacity}
.cta-pill{display:flex;align-items:center;gap:8px;border-radius:50px;padding:12px 28px;background-image:var(--gradient-hero-cta);color:#fff;font-size:16px;font-weight:400}
.cta-pill .dot{width:3px;height:3px;border-radius:9999px;background:#fff;flex:none}
.nav-mobile{display:none}
@media (max-width:855px){
  .nav-desktop{display:none}
  .nav-mobile{display:flex;position:fixed;inset-inline:0;top:0;padding:16px 16px 0;justify-content:space-between;align-items:flex-start;pointer-events:auto}
  .nav-mobile .logo-pill{height:44px;padding-inline:20px}
  .nav-m-right{position:relative}
  .burger{width:44px;height:44px;border-radius:9999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5px;padding:0}
  .burger span{display:block;width:16px;height:1.5px;background:#fff;border-radius:1px;will-change:transform,opacity}
  .sheet{position:absolute;top:calc(100% + 10px);right:0;width:220px;border-radius:24px;padding:10px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--hero-glass-border);background:var(--hero-glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;visibility:hidden}
  .sheet a{display:block;padding:12px 16px;border-radius:16px;font-size:16px}
  .sheet a.active{background:rgb(255 255 255 / 0.1)}
  .sheet .cta-pill{justify-content:center;width:100%;margin-top:2px}
}

/* ---------- shared type ---------- */
.masthead{position:absolute;top:100px;left:389px;width:663px;text-align:center;font-weight:300;font-size:56px;line-height:1}
.mast-line{display:block}
.ltr{display:inline-block;white-space:pre;will-change:transform,opacity,filter}
.words{display:flex;flex-wrap:wrap;justify-content:center;column-gap:.3em}
.word{display:inline-block;will-change:transform,opacity,filter}
.subtitle{position:absolute;top:633px;left:518px;width:405px;font-weight:400;font-size:16px;line-height:1.2;color:#fff}
.form-slot{position:absolute;top:703px;left:409px;width:623px;will-change:transform,opacity}

/* ---------- hero ---------- */
.hero-mark{position:absolute;top:360px;left:658.46px;width:123.86px;height:124.97px;will-change:transform,opacity}
.mark-halo{position:absolute;left:50%;top:50%;width:210px;height:210px;transform:translate(-50%,-50%);border-radius:9999px;background:rgb(0 0 0 / 0.6);filter:blur(40px)}
.mark-ring{position:absolute;left:50%;top:50%;width:285px;height:285px;transform:translate(-50%,-50%);border-radius:9999px;border:1px solid var(--hero-glass-border)}
.hero-icon{position:absolute;inset:0}
.hero-icon svg{position:absolute;inset:0;width:100%;height:100%;will-change:transform}

/* ---------- contact form ---------- */
.contact{display:flex;align-items:center;gap:25px;border-radius:32px;border:1px solid var(--hero-glass-border);background:var(--hero-glass);padding:2px 2px 2px 32px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto}
.contact input{width:180px;background:transparent;color:#fff;font-size:16px;font-weight:400}
.contact input::placeholder{color:rgba(255,255,255,.9)}
.contact .submit{margin-left:auto;display:flex;align-items:center;gap:8px;border-radius:50px;padding:2px 28px 2px 2px;background-image:var(--gradient-hero-cta);color:#fff;font-size:16px;flex:none;will-change:transform}
.contact .chev{width:39px;height:39px;border-radius:9999px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.contact .chev svg{width:23px;height:23px;display:block}

/* ---------- services ---------- */
.svc-cell{position:absolute;width:400px;display:flex;flex-direction:column;gap:12px;will-change:transform,opacity}
.svc-cell.svc-right{align-items:flex-end;text-align:right}
.svc-cell h3{font-weight:300;font-size:32px;line-height:1;color:#fff}
.svc-cell p{font-size:16px;line-height:1.2;color:#fff}
.svc-rule{margin-top:16px;height:1px;width:100%;background:var(--gradient-service-rule)}
.svc-rule.alt{background:var(--gradient-service-rule-alt)}
.svc-foot{position:absolute;top:712px;left:509px;width:423px;text-align:center;font-size:16px;line-height:1.2;color:#fff}
.svc-mobile{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;gap:24px;padding:96px 24px 32px}

/* ---------- timeline ---------- */
.tl-track{position:absolute;top:0;left:0;height:800px;will-change:transform}
.tl-baseline{position:absolute;top:754px;left:50px;height:1px;background:var(--timeline-rail);transform-origin:left}
.tl-tick{position:absolute;top:579px;width:1px;height:174px;transform-origin:bottom;background:var(--gradient-timeline-tick)}
.tl-marker{position:absolute;width:19px;height:19px;will-change:transform,opacity}
.tl-marker svg{display:block;width:19px;height:19px}
.tl-content{position:absolute;top:579px;width:405px;display:flex;flex-direction:column;gap:24px;will-change:transform,opacity}
.tl-group{width:204px;display:flex;flex-direction:column;gap:12px}
.tl-idx{font-size:16px;font-weight:400;background:var(--gradient-hero-icon);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.tl-content h3{font-weight:300;font-size:32px;line-height:1;color:#fff}
.tl-content p{font-size:16px;line-height:1.2;color:#fff}
.tl-mobile{position:absolute;inset:0;display:none;flex-direction:column;gap:24px;padding:92px 24px 20px}
.tlm-window{flex:1;overflow:hidden}
.tlm-list{will-change:transform}
.tlm-item{position:relative;padding-left:28px;padding-bottom:28px;will-change:transform,opacity}
.tlm-item::before{content:"";position:absolute;left:6.5px;top:18px;bottom:0;width:1px;background:var(--timeline-rail)}
.tlm-item:last-child::before{display:none}
.tlm-tri{position:absolute;left:0;top:2px;width:14px;height:14px}
.tlm-tri svg{display:block;width:14px;height:14px}
.tlm-idx{font-size:14px;background:var(--gradient-hero-icon);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.tlm-item h3{font-weight:300;font-size:22px;line-height:1.1;color:#fff;margin-top:6px}
.tlm-item p{font-size:15px;line-height:1.3;color:rgb(255 255 255 / 0.8);margin-top:8px;max-width:420px}

/* ---------- impact ---------- */
.imp-foot{width:100%}

/* ---------- mobile reflow (<855px) ---------- */
@media (max-width:855px){
  .frame{top:0;left:0;width:100%;height:100%;transform:none}
  .masthead{position:static;width:auto;font-size:clamp(24px,6.4vw,44px);line-height:1.06}
  #ov-hero .frame{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:92px 20px 28px}
  .hero-mark{position:relative;top:auto;left:auto;width:92px;height:92px;flex:none}
  .mark-halo{width:150px;height:150px}
  .mark-ring{width:200px;height:200px}
  #ov-hero .subtitle,#ov-impact .subtitle{position:static;width:auto;max-width:420px;font-size:15px}
  #ov-hero .form-slot,#ov-impact .form-slot{position:static;width:100%;max-width:420px}
  .contact{flex-direction:column;align-items:stretch;gap:10px;border-radius:24px;padding:10px}
  .contact input{width:100%;border-radius:16px;background:rgb(255 255 255 / 0.06);padding:14px 18px}
  .contact .submit{margin-left:0;width:100%;justify-content:center;padding:6px 18px 6px 6px}
  #ov-services .frame{display:none}
  .svc-mobile{display:flex}
  .svc-mlist{display:flex;flex-direction:column;gap:18px;width:100%;max-width:420px}
  .svc-mcell{display:flex;flex-direction:column;gap:8px}
  .svc-mcell h3{font-weight:300;font-size:22px;line-height:1;color:#fff}
  .svc-mcell p{font-size:15px;color:rgb(255 255 255 / 0.8)}
  .svc-mcell .svc-rule{margin-top:10px}
  .svc-mfoot{font-size:14px;color:rgb(255 255 255 / 0.85);text-align:center;max-width:420px}
  #ov-timeline .frame{display:none}
  .tl-mobile{display:flex}
  #ov-impact .frame{display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:100px 20px 36px}
  .imp-foot{display:flex;flex-direction:column;align-items:center;gap:16px}
}
</style>
</head>
<body>

<!-- The one continuous WebGL scene, fixed behind everything -->
<div id="scene-wrap">
  <canvas id="scene"></canvas>
  <div class="scene-overlay"></div>
</div>

<!-- Warp-tunnel load readout -->
<div id="loader" role="status" aria-live="polite">
  <p class="pct"><span id="pct-num">0</span><span class="pct-sym">%</span></p>
  <div class="load-rail"><span id="load-fill" class="load-fill"></span></div>
</div>

<!-- Fixed nav -->
<header id="nav">
  <div class="nav-desktop" id="nav-desktop">
    <div class="nav-rev"><div class="pill logo-pill" data-hover><button data-scroll="#hero" aria-label="Helion — back to top"><span id="wordmark-a"></span></button></div></div>
    <div class="nav-rev"><nav class="pill links-pill" data-hover aria-label="Primary"><ul id="nav-links"></ul></nav></div>
    <div class="nav-rev"><button class="cta-pill" id="nav-cta" data-scroll="#sitemap"><span>Send Request</span><i class="dot"></i></button></div>
  </div>
  <div class="nav-mobile">
    <div class="nav-rev"><div class="pill logo-pill"><button data-scroll="#hero" aria-label="Helion — back to top"><span id="wordmark-b"></span></button></div></div>
    <div class="nav-m-right nav-rev">
      <button class="pill burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="sheet" id="sheet"></div>
    </div>
  </div>
</header>

<!-- 1. Hero -->
<div class="overlay" id="ov-hero">
  <div class="frame" data-fit="contain">
    <h1 class="masthead" id="hero-h"></h1>
    <div class="hero-mark" id="hero-mark">
      <div class="mark-halo"></div>
      <div class="mark-ring"></div>
      <div class="hero-icon" id="hero-icon"></div>
    </div>
    <p class="subtitle" id="hero-sub"></p>
    <div class="form-slot" id="hero-form"></div>
  </div>
</div>

<!-- 2. Services -->
<div class="overlay" id="ov-services">
  <div class="frame" data-fit="width" id="svc-frame">
    <h2 class="masthead" id="svc-h"></h2>
    <p class="svc-foot" id="svc-foot"></p>
  </div>
  <div class="svc-mobile">
    <h2 class="masthead" id="svc-mh"></h2>
    <div class="svc-mlist" id="svc-mlist"></div>
    <p class="svc-mfoot" id="svc-mfoot"></p>
  </div>
</div>

<!-- 3. Timeline / roadmap -->
<div class="overlay" id="ov-timeline">
  <div class="frame" data-fit="width">
    <div class="tl-track" id="tl-track"></div>
    <h2 class="masthead" id="tl-h"></h2>
  </div>
  <div class="tl-mobile">
    <h2 class="masthead" id="tlm-h"></h2>
    <div class="tlm-window" id="tlm-window"><ul class="tlm-list" id="tlm-list"></ul></div>
  </div>
</div>

<!-- 4. Impact / closing -->
<div class="overlay" id="ov-impact">
  <div class="frame" data-fit="contain">
    <h2 class="masthead" id="imp-h"></h2>
    <div class="imp-foot">
      <p class="subtitle" id="imp-sub"></p>
      <div class="form-slot" id="imp-form"></div>
    </div>
  </div>
</div>

<!-- Scroll anchors -->
<main>
  <div class="slide" id="hero"></div>
  <div class="slide" id="sitemap"></div>
  <div class="slide" id="timeline"></div>
  <div class="slide" id="impact"></div>
</main>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ================================================================
   helpers
================================================================ */
const TAU = Math.PI * 2;
const clamp01 = v => Math.min(1, Math.max(0, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const mqMobile = matchMedia('(max-width: 855px)'); // must agree exactly with the CSS breakpoint

function cubicBezier(x1, y1, x2, y2) {
  const A = (a1, a2) => 1 - 3 * a2 + 3 * a1, B = (a1, a2) => 3 * a2 - 6 * a1, C = a1 => 3 * a1;
  const calc = (t, a1, a2) => ((A(a1, a2) * t + B(a1, a2)) * t + C(a1)) * t;
  const slope = (t, a1, a2) => 3 * A(a1, a2) * t * t + 2 * B(a1, a2) * t + C(a1);
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const s = slope(t, x1, x2); if (Math.abs(s) < 1e-6) break; t -= (calc(t, x1, x2) - x) / s; }
    t = Math.min(1, Math.max(0, t));
    return calc(t, y1, y2);
  };
}
const easeReveal = cubicBezier(0.16, 0.77, 0.3, 1);
const cubicOut = t => 1 - Math.pow(1 - t, 3);

/* -------- tween engine (no CSS transitions anywhere) -------- */
const tweens = new Set();
function tween({ delay = 0, dur = 1000, ease = easeReveal, update, done }) {
  tweens.add({ t0: performance.now() + delay, dur, ease, update, done });
}
function stepTweens(now) {
  tweens.forEach(t => {
    if (now < t.t0) return;
    const k = Math.min(1, (now - t.t0) / t.dur);
    t.update(t.ease(k), k);
    if (k >= 1) { tweens.delete(t); if (t.done) t.done(); }
  });
}

/* -------- springs (hover / burger / sheet) -------- */
const springs = new Set();
function spring({ value = 0, target = 0, tension = 320, friction = 22, onUpdate }) {
  const s = { v: value, t: target, vel: 0, tension, friction, onUpdate };
  springs.add(s); return s;
}
function stepSprings(dt) {
  springs.forEach(s => {
    const n = Math.max(1, Math.min(8, Math.ceil(dt / 8)));
    const h = (dt / n) / 1000;
    for (let i = 0; i < n; i++) {
      const a = s.tension * (s.t - s.v) - s.friction * s.vel;
      s.vel += a * h; s.v += s.vel * h;
    }
    if (Math.abs(s.t - s.v) < 1e-4 && Math.abs(s.vel) < 1e-4) { s.v = s.t; s.vel = 0; }
    if (s.onUpdate) s.onUpdate(s.v);
  });
}
function hoverScale(el, to = 1.04, tension = 320, friction = 22) {
  if (reduced || !el) return;
  const s = spring({ value: 1, target: 1, tension, friction, onUpdate: v => { el.style.transform = `scale(${v.toFixed(4)})`; } });
  el.addEventListener('mouseenter', () => { s.t = to; });
  el.addEventListener('mouseleave', () => { s.t = 1; });
}

/* -------- text reveals -------- */
function buildHeading(el, lines) {
  if (!el) return;
  el.setAttribute('aria-label', lines.map(l => l.text).join(' '));
  el.innerHTML = '';
  lines.forEach(line => {
    const lw = document.createElement('span');
    lw.className = 'mast-line'; lw.setAttribute('aria-hidden', 'true');
    const chars = [...line.text]; const n = chars.length;
    chars.forEach((ch, i) => {
      const s = document.createElement('span');
      s.className = 'ltr'; s.textContent = ch;
      const f = n > 1 ? i / (n - 1) : 0;
      const mix = line.bright === 'left' ? f : 1 - f;      // 0 at the opaque (bright) end
      const r = Math.round(lerp(255, 200, mix));
      const g = Math.round(lerp(255, 214, mix));
      const a = lerp(1, 0.2, mix);
      s.style.color = `rgba(${r},${g},255,${a.toFixed(3)})`;
      s.dataset.d = line.bright === 'left' ? i : n - 1 - i; // cascade starts at the bright end
      if (!reduced) s.style.opacity = '0';
      lw.appendChild(s);
    });
    el.appendChild(lw);
  });
}
function revealHeading(el, base) {
  if (!el) return;
  const stag = mqMobile.matches ? 34 : 42;
  el.querySelectorAll('.ltr').forEach(s => {

const MORPH_VERT = `
attribute vec4 aUni;    // (ellipse radius, height, life phase, twin)
attribute vec4 aBurst;  // (filament point xyz, distance along filament)
attribute vec2 aSeed;   // (general seed, per-arm brightness)

uniform float iTime; uniform float uAlpha; uniform vec2 uRes;
uniform float uT1; uniform float uT2;
uniform float uNeedUni; uniform float uNeedBurst; uniform float uNeedMael;
uniform vec3 uPointer; uniform vec3 uPointerAxis;
uniform float uPointerR; uniform float uPointerPush;
uniform float uPointerSwirl; uniform float uPointerGlow;
uniform float uStagger; uniform float uMidBoost;
uniform float uArc1; uniform float uSwirl1; uniform float uArc2; uniform float uSwirl2;

uniform float uUniTime; uniform mat3 uUniRot; uniform float uUniScale;
uniform float uUniEllipse; uniform float uUniLife; uniform float uUniSpawnSpread;
uniform float uUniOmega; uniform float uUniV0; uniform float uUniDecay;
uniform float uUniSize; uniform float uUniBright;

uniform float uBurstScale; uniform float uBurstSway; uniform float uBurstSwaySpeed;
uniform float uBurstShimmer; uniform float uBurstShimmerSpeed;
uniform float uBurstTipFade; uniform float uBurstSize; uniform float uBurstBright;

uniform mat3 uMaelRot; uniform float uRInner; uniform float uROuter;
uniform float uSpin; uniform float uMaelTwinkle;
uniform float uCrescent; uniform float uCrescentAngle;
uniform float uMaelSize; uniform float uMaelBright; uniform float uMaelPhase;

uniform vec3 uUniDeep; uniform vec3 uUniMid; uniform vec3 uUniBrightC;
uniform vec3 uBurstCore; uniform vec3 uBurstInner;
uniform vec3 uBurstMid; uniform vec3 uBurstOuter;
uniform vec3 uArm; uniform vec3 uArmHot; uniform vec3 uMaelCore; uniform vec3 uPink;

varying vec3 vCol; varying float vB;
#define TAU 6.2831853

vec2 rot2(vec2 v, float a) {
  float c = cos(a), s = sin(a);
  return vec2(v.x * c - v.y * s, v.x * s + v.y * c);
}

float stagger(float t, float seed) {
  float s = clamp(t * (1.0 + uStagger) - seed * uStagger, 0.0, 1.0);
  return s * s * (3.0 - 2.0 * s);
}

void main() {
  float seed = aSeed.x;

  vec3 pUni = vec3(0.0);
  vec3 cUni = uUniDeep;
  float bUni = 0.0;
  float sUni = 1.0;

  if (uNeedUni > 0.5) {
    float born = uUniTime / uUniLife - aUni.z * uUniSpawnSpread;
    float alive = step(0.0, born);
    float life = fract(max(born, 0.0));
    float age = life * uUniLife;

    float ang = uUniOmega * (uUniTime - age);
    float radius = aUni.x + uUniV0 * age - uUniDecay * age * age;

    pUni = vec3(cos(ang) * radius * uUniEllipse, aUni.y, sin(ang) * radius);
    pUni.xz *= mix(1.0, -1.0, aUni.w);
    pUni = uUniRot * pUni * uUniScale;

    bUni = alive * smoothstep(0.0, 0.14, life)
         * (1.0 - smoothstep(0.18, 1.0, life)) * uUniBright;

    cUni = uUniDeep;
    cUni = mix(cUni, uUniMid, step(0.34, seed));
    cUni = mix(cUni, uUniBrightC, step(0.67, seed));
    cUni = mix(cUni, uPink, step(0.94, seed));

    sUni = 0.35 + 0.65 * fract(seed * 17.0);
  }

  vec3 pBurst = vec3(0.0);
  vec3 cBurst = uBurstMid;
  float bBurst = 0.0;
  float sBurst = 1.0;

  if (uNeedBurst > 0.5) {
    vec3 f = aBurst.xyz;
    float along = aBurst.w;

    vec3 d = normalize(f + 1e-5);
    vec3 ax = normalize(cross(d, abs(d.y) > 0.99 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0)));
    vec3 ay = cross(d, ax);

    float amp = uBurstSway * along;
    float ph = seed * TAU;
    float ts = iTime * uBurstSwaySpeed;
    float w1 = sin(ts + ph + along * 5.0);
    float w2 = cos(ts * 1.27 + ph * 1.7 + along * 9.0);
    float w3 = 0.5 * sin(ts * 0.6 + ph);

    f += ax * (w1 + w3) * amp;
    f += ay * w2 * amp * 0.8;

    pBurst = f * uBurstScale;

    float sh = max(0.0, 0.6 + uBurstShimmer * 0.55
      * sin(along * 16.0 - iTime * uBurstShimmerSpeed + seed * 28.0));

    float fade = mix(1.15, uBurstTipFade, smoothstep(0.0, 1.0, along));

    float fn = clamp((aSeed.y - 0.55) / 0.45, 0.0, 1.0);
    float fil = 0.035 + 2.4 * pow(fn, 2.6);
    bBurst = sh * fade * fil * uBurstBright;

    cBurst = mix(uBurstInner, uBurstMid, smoothstep(0.0, 0.5, along));
    cBurst = mix(cBurst, uBurstOuter, smoothstep(0.5, 1.0, along));
    cBurst = mix(cBurst, uBurstCore, (1.0 - smoothstep(0.0, 0.12, along)) * 0.9);
    cBurst = mix(cBurst, uPink, step(0.94, seed) * smoothstep(0.45, 1.0, along));

    sBurst = 0.8 + 0.45 * (1.0 - along);
  }

  vec3 pMael = vec3(0.0);
  vec3 cMael = uArm;
  float bMael = 0.0;
  float sMael = 1.0;

  if (uNeedMael > 0.5) {
    vec3 m = position;
    m.xy = rot2(m.xy, iTime * uSpin);

    float radius = length(position.xy);
    float core = clamp((uROuter - radius) / (uROuter - uRInner), 0.0, 1.0);

    float a2 = atan(m.y, m.x) - uCrescentAngle;
    float d = abs(atan(sin(a2), cos(a2)));
    float crescent = smoothstep(1.5 + uMaelPhase * 0.9, 0.0, d)
                   * core * core * uCrescent * (1.0 + 0.5 * uMaelPhase);

    pMael = uMaelRot * m;

    float tw = 1.0 - uMaelTwinkle * (0.5 + 0.5 * sin(iTime * 3.0 + seed * TAU));
    float bright = aSeed.y * (0.3 + 0.7 * core);

    cMael = mix(mix(uArm, uArmHot, uMaelPhase), uMaelCore, core * core);
    cMael = mix(cMael, uPink, clamp(crescent, 0.0, 1.0));

    bMael = (bright * tw * (0.7 + core) + crescent * 1.5)
          * uMaelBright * (1.0 + 0.18 * uMaelPhase);
    sMael = 1.0 + core * 1.1 + crescent * 1.6;
  }

  float t1 = stagger(uT1, seed);
  float t2 = stagger(uT2, fract(seed * 3.7 + 0.31));

  vec3 dir = normalize(vec3(
    sin(seed * 91.3 + 0.7),
    cos(seed * 57.1 + 2.1),
    sin(seed * 33.7 + 4.3)
  ) + 1e-4);

  vec3 p = mix(pUni, pBurst, t1);
  float mid1 = 4.0 * t1 * (1.0 - t1);
  p += dir * (uArc1 * mid1);
  p.xz = rot2(p.xz, mid1 * uSwirl1 * (0.6 + 0.8 * seed));

  p = mix(p, pMael, t2);
  float mid2 = 4.0 * t2 * (1.0 - t2);
  p += dir * (uArc2 * mid2);
  p.xz = rot2(p.xz, mid2 * uSwirl2 * (0.6 + 0.8 * seed));

  vec3 pd = p - uPointer;
  float pl = length(pd);
  float infl = exp(-(pl * pl) / max(0.001, uPointerR * uPointerR));
  vec3 pdir = normalize(pd + 1e-4);
  p += pdir * (infl * uPointerPush);
  p += normalize(cross(uPointerAxis, pdir) + 1e-4) * (infl * uPointerSwirl);

  vCol = mix(mix(cUni, cBurst, t1), cMael, t2);
  vB = mix(mix(bUni, bBurst, t1), bMael, t2)
     * uAlpha * (1.0 + uMidBoost * (mid1 + mid2))
     * (1.0 + infl * uPointerGlow);

  if (vB < 0.004) {
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    gl_PointSize = 0.0;
    return;
  }

  float size = mix(
    mix(uUniSize * sUni, uBurstSize * sBurst, t1),
    uMaelSize * sMael,
    t2
  );

  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  gl_PointSize = clamp(size * uRes.y / 1000.0 / -mv.z, 1.0, 15.0);
  gl_Position = projectionMatrix * mv;
}
`;

uniform float uHaloAmount; uniform float uHaloWidth; uniform float uHaloFalloff;
varying vec3 vCol; varying float vB;

const WARP_VERT = `
attribute float aSeed; attribute float aSpeed; attribute float aRadius;
attribute float aAngle; attribute float aEnd; attribute float aSide;
uniform float iTime; uniform float uBoost; uniform float uSurge;
uniform float uSpread; uniform float uWidth; uniform vec2 uResolution;
varying float vEnd; varying float vB; varying float vSeed; varying float vSide;

void main() {
  float rate = 0.13 + 0.30 * uBoost + 0.55 * uSurge;
  float life = fract(iTime * aSpeed * rate + aSeed);
  float e = life * life;
  float z = -mix(60.0, 1.2, e);
  float len = (1.5 + 11.0 * e) * (0.3 + 0.9 * uBoost) * (1.0 + 3.5 * uSurge);
  float a = aAngle + iTime * 0.06;
  float r = aRadius * uSpread;
  vec2 xy = vec2(cos(a) * r, sin(a) * r);
  vec4 headClip = projectionMatrix * modelViewMatrix * vec4(xy, z, 1.0);
  vec4 tailClip = projectionMatrix * modelViewMatrix * vec4(xy, z - len, 1.0);
  vec4 clip = mix(tailClip, headClip, aEnd);
  vec2 headNDC = headClip.xy / headClip.w;
  vec2 tailNDC = tailClip.xy / tailClip.w;
  vec2 d = (headNDC - tailNDC) * uResolution;
  vec2 dir = length(d) > 1e-4 ? normalize(d) : vec2(0.0, 1.0);
  vec2 normal = vec2(-dir.y, dir.x);
  vec2 offset = normal * (aSide * uWidth * 0.5) / uResolution * 2.0;
  clip.xy += offset * clip.w;
  vEnd = aEnd;
  vSeed = aSeed;
  vSide = aSide;
  vB = smoothstep(0.0, 0.18, life) * (0.2 + 0.8 * e);
  gl_Position = clip;
}
`;

const FINAL_FRAG = `
uniform float iTime; uniform sampler2D tDiffuse;
uniform vec3 iCornerLow; uniform vec3 iCornerHigh;
uniform float uSpread; uniform float uIntensity;
varying vec2 vUv;
vec3 warp3d(vec3 pos, float t) {
  float curv = .8, a = 1.9, b = 0.7;
  pos *= 2.;
  pos.x += curv * sin(t + a * pos.y) + t * b;
  pos.y += curv * cos(t + a * pos.x);
  pos.y += curv * sin(t + a * pos.z) + t * b;
  pos.z += curv * cos(t + a * pos.y);
  pos.z += curv * sin(t + a * pos.x) + t * b;
  pos.x += curv * cos(t + a * pos.z);
  return 0.5 + 0.5 * cos(pos.xyz + vec3(1, 2, 4));
}
void main() {
  vec2 uv = 2. * vUv - 1.;
  vec3 scene = texture2D(tDiffuse, vUv).xyz;
  float mask = smoothstep(uSpread, 1., abs(uv.y))
             * smoothstep(-.75, 1., -uv.y * uv.x);
  if (mask <= 0.0015) { gl_FragColor = vec4(scene, 1.); return; }
  vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime * 1.5), vec3(1.5));
  vec3 col = uIntensity * iCornerLow * w.x;
  col *= w.y;
  col += iCornerHigh * w.z * 1.35;
  col *= mask;
  gl_FragColor = vec4(col + scene, 1.);
}
`;

/* ---------------- geometry builders ---------------- */
function buildMorph() {
  const arms = MORPH[0];
  const perArm = Math.max(2, Math.round(MORPH[1] * 0.7)); // density factor 0.7
  const count = arms * perArm;
  const positions = new Float32Array(count * 3);
  const uni = new Float32Array(count * 4);
  const burst = new Float32Array(count * 4);
  const seeds = new Float32Array(count * 2);

  const maelRInner = 6.4, maelROuter = 48, maelTightness = 2.3, maelThickness = 0.9,
        maelBulge = 1, maelFunnel = 1.05, burstSpread = 3, burstBend = 0.4, burstCoreStart = 0.06;
  const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(TAU * Math.random());
  const logSpan = Math.log(maelROuter / maelRInner);
  let k = 0;
  for (let a = 0; a < arms; a++) {
    const armPhase = Math.random() * TAU;
    const armBright = 0.55 + 0.45 * Math.random();
    // one plasma filament direction + orthonormal cross-axes
    const bz = Math.random() * 2 - 1, bth = Math.random() * TAU, brr = Math.sqrt(1 - bz * bz);
    const dir = new THREE.Vector3(brr * Math.cos(bth), brr * Math.sin(bth), bz);
    const up = Math.abs(dir.y) > 0.99 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
    const bu = new THREE.Vector3().crossVectors(dir, up).normalize();
    const bv = new THREE.Vector3().crossVectors(dir, bu).normalize();
    let len = burstSpread * (0.28 + Math.random() * Math.random() * 1.15);
    if (Math.random() > 0.86) len *= 1.7;
    const f1 = 2 + Math.random() * 5, f2 = 2 + Math.random() * 5, p1 = Math.random() * TAU, p2 = Math.random() * TAU;
    const curl = 0.5 * (0.45 + Math.random());
    const bend = new THREE.Vector3().addScaledVector(bu, Math.random() - 0.5)
      .addScaledVector(bv, Math.random() - 0.5).normalize().multiplyScalar(burstBend * (0.4 + Math.random()));
    const p = new THREE.Vector3();
    for (let i = 0; i < perArm; i++) {
      const t = perArm > 1 ? i / (perArm - 1) : 0;
      // maelstrom: log-spiral filament point, with out-of-plane profile + funnel
      const radius = maelRInner * Math.exp(logSpan * t) * (1 + (Math.random() - 0.5) * 0.05);
      const angle = armPhase + maelTightness * Math.log(radius / maelRInner) + (Math.random() - 0.5) * 0.06;
      const inner = radius / maelRInner - 1;
      const bulge = 1 + maelBulge * Math.exp(-inner * inner * 1.6);
      const rNorm = Math.min(1, radius / maelROuter);
      const funnelZ = -maelFunnel * maelROuter * 0.4 * Math.pow(1 - rNorm, 1.8);
      positions[k * 3]     = radius * Math.cos(angle);
      positions[k * 3 + 1] = radius * Math.sin(angle);
      positions[k * 3 + 2] = funnelZ + gauss() * 0.5 * maelThickness * (0.4 + radius * 0.03) * bulge;
      // universe: sphere-and-tube distribution -> ellipse radius from offset focus
      const theta = TAU * Math.random(), phi = Math.acos(2 * Math.random() - 1), sinPhi = Math.sin(phi);
      const spread = Math.random() * (Math.random() < 0.3 ? 4 : 1) * 0.4;
      const ux = sinPhi * Math.cos(theta) * spread, uy = sinPhi * Math.sin(theta) * spread, uz = Math.cos(phi) * spread;
      uni[k * 4]     = Math.hypot(ux - 2.5, uz);   // ellipse radius at spawn
      uni[k * 4 + 1] = uy;                          // height in disc
      uni[k * 4 + 2] = Math.random();               // life phase
      uni[k * 4 + 3] = a % 2;                       // which twin galaxy
      // burst: point along its filament (curl through bu/bv at two freqs, bent off-axis)
      const rad = burstCoreStart + len * t;
      p.copy(dir).multiplyScalar(rad);
      p.addScaledVector(bu, Math.sin(t * f1 * Math.PI + p1) * curl * t);
      p.addScaledVector(bv, Math.cos(t * f2 * Math.PI + p2) * curl * t);
      p.addScaledVector(bend, t * t);
      burst[k * 4] = p.x; burst[k * 4 + 1] = p.y; burst[k * 4 + 2] = p.z; burst[k * 4 + 3] = t;
      seeds[k * 2] = Math.random(); seeds[k * 2 + 1] = armBright;
      k++;
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  g.setAttribute('aUni', new THREE.BufferAttribute(uni, 4));
  g.setAttribute('aBurst', new THREE.BufferAttribute(burst, 4));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 2));

  morphU = {
    iTime: { value: 0 }, uAlpha: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) },
    uT1: { value: 0 }, uT2: { value: 0 },
    uNeedUni: { value: 1 }, uNeedBurst: { value: 0 }, uNeedMael: { value: 0 },
    uPointer: { value: new THREE.Vector3(9999, 9999, 9999) }, uPointerAxis: { value: new THREE.Vector3(0, 0, 1) },
    uPointerR: { value: 3.4 }, uPointerPush: { value: 0 }, uPointerSwirl: { value: 0 }, uPointerGlow: { value: 0 },
    uStagger: { value: 0.55 }, uMidBoost: { value: 0.7 },
    uArc1: { value: 1.1 }, uSwirl1: { value: 2.2 }, uArc2: { value: 9 }, uSwirl2: { value: 3.4 },
    uUniTime: { value: 6 }, uUniRot: { value: rotation(1, -1.2, 0.5) }, uUniScale: { value: 1.2 },
    uUniEllipse: { value: 1 }, uUniLife: { value: 6 }, uUniSpawnSpread: { value: 1 },
    uUniOmega: { value: 1.2 }, uUniV0: { value: 0.72 }, uUniDecay: { value: 0.036 },
    uUniSize: { value: 70 * viewScale }, uUniBright: { value: 0.58 * 0.75 },
    uBurstScale: { value: 7 }, uBurstSway: { value: 0.08 }, uBurstSwaySpeed: { value: 1.1 },
    uBurstShimmer: { value: 0.55 }, uBurstShimmerSpeed: { value: 3 },
    uBurstTipFade: { value: 0.42 }, uBurstSize: { value: 44 * 1.55 * viewScale }, uBurstBright: { value: 0.85 * 1.1 },
    uMaelRot: { value: rotation(0.95, 0, 0) }, uRInner: { value: 6.4 }, uROuter: { value: 48 },
    uSpin: { value: 0.085 * 3 }, uMaelTwinkle: { value: 0.75 },
    uCrescent: { value: 0.9 }, uCrescentAngle: { value: -0.7 },
    uMaelSize: { value: 62 * 1.55 * viewScale }, uMaelBright: { value: 0.56 * 0.95 }, uMaelPhase: { value: 0 },
    uUniDeep: { value: C(accent500) }, uUniMid: { value: C(accent400) }, uUniBrightC: { value: C(accent200) },
    uBurstCore: { value: C(foreground) }, uBurstInner: { value: C(accent200) },
    uBurstMid: { value: C(accent500) }, uBurstOuter: { value: C(accent600) },
    uArm: { value: C(accent500) }, uArmHot: { value: C(accent300) }, uMaelCore: { value: C(accent700) },
    uPink: { value: C(signalGlow) },
    uCoreStrength: { value: 1.5 }, uCoreSize: { value: 0.5 }, uCoreSharp: { value: 2.4 },
    uHaloAmount: { value: 0.6 }, uHaloWidth: { value: 1 }, uHaloFalloff: { value: 1.5 }
  };
  const m = new THREE.ShaderMaterial({
    uniforms: morphU, vertexShader: MORPH_VERT, fragmentShader: MORPH_FRAG,
    blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, transparent: true
  });
  morphPts = new THREE.Points(g, m);
  morphPts.frustumCulled = false;
  scene.add(morphPts);
}

function buildStarfield() {
  // stars — far shell
  {
    const n = STAR_COUNT;
    const pos = new Float32Array(n * 3), aSize = new Float32Array(n), aSeed = new Float32Array(n), aPink = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const z = Math.random() * 2 - 1, th = Math.random() * TAU, rr = Math.sqrt(1 - z * z);
      const r = 70 + Math.random() * 160;
      pos[i * 3] = rr * Math.cos(th) * r;
      pos[i * 3 + 1] = rr * Math.sin(th) * r;
      pos[i * 3 + 2] = z * r - 40; // depthBias
      aSize[i] = 0.14 + Math.pow(Math.random(), 8) * 0.85;
      aSeed[i] = Math.random();
      aPink[i] = Math.random() < 0.12 ? 1 : 0;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(aSize, 1));
    g.setAttribute('aSeed', new THREE.BufferAttribute(aSeed, 1));
    g.setAttribute('aPink', new THREE.BufferAttribute(aPink, 1));
    starU = {
      iTime: { value: 0 }, uAlpha: { value: 0 }, uSize: { value: 1.5 }, uBright: { value: 2 },
      uViewScale: { value: viewScale }, uCool: { value: C(accent200) }, uPink: { value: C(signalRing) }
    };
    const m = new THREE.ShaderMaterial({
      uniforms: starU, vertexShader: STAR_VERT, fragmentShader: STAR_FRAG,
      blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, transparent: true
    });
    starPts = new THREE.Points(g, m);
    starPts.frustumCulled = false;
    scene.add(starPts);
  }
  // near dust motes
  {
    const n = DUST_COUNT;
    const pos = new Float32Array(n * 3), aSeed = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      pos[i * 3] = (Math.random() - 0.5) * 90;
      pos[i * 3 + 1] = (Math.random() - 0.5) * 60;
      pos[i * 3 + 2] = (Math.random() - 0.5) * 50 + 10; // biased toward the camera
      aSeed[i] = Math.random();
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aSeed', new THREE.BufferAttribute(aSeed, 1));
    dustU = {
      iTime: { value: 0 }, uAlpha: { value: 0 }, uViewScale: { value: viewScale }, uColor: { value: C(accent500) }
    };
    const m = new THREE.ShaderMaterial({
      uniforms: dustU, vertexShader: DUST_VERT, fragmentShader: DUST_FRAG,
      blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, transparent: true
    });
    dustPts = new THREE.Points(g, m);
    dustPts.frustumCulled = false;
    scene.add(dustPts);
  }
}

function rasterizeMarkTargets() {
  const S = 4, W = 124 * S, H = 125 * S;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const lists = [];
  [TRIANGLE_OUTER, TRIANGLE_INNER].forEach(d => {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.fill(new Path2D(d), 'evenodd');
    const img = ctx.getImageData(0, 0, W, H).data;
    const pts = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (img[(y * W + x) * 4 + 3] > 128) pts.push([x + 0.5, y + 0.5]);
    }
    lists.push(pts);
  });
  return { lists, W, H };
}

function buildMark() {
  markGroup = new THREE.Group();
  markGroup.visible = false;
  scene.add(markGroup);

  const { lists, W, H } = rasterizeMarkTargets();
  const MARK_SIZE = 10, SPREAD_MIN = 10, SPREAD_SPAN = 13.5, THICKNESS = 1.5;
  const n = MARK_COUNT;
  const pos = new Float32Array(n * 3), tgt = new Float32Array(n * 3),
        aSeed = new Float32Array(n), aSize = new Float32Array(n), aTri = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const tri = i % 2; // even -> outer, odd -> inner
    const pts = lists[tri];
    const [px, py] = pts[(Math.random() * pts.length) | 0];
    tgt[i * 3] = (px / W - 0.5) * MARK_SIZE;
    tgt[i * 3 + 1] = -(py / H - 0.5) * MARK_SIZE;
    tgt[i * 3 + 2] = (Math.random() - 0.5) * THICKNESS;
    const r = SPREAD_MIN + Math.random() * SPREAD_SPAN, ang = Math.random() * TAU;
    pos[i * 3] = Math.cos(ang) * r;
    pos[i * 3 + 1] = Math.sin(ang) * r;
    pos[i * 3 + 2] = (Math.random() * 2 - 1) * 1.5;
    aSeed[i] = Math.random();
    aSize[i] = 0.5 + Math.random();
    aTri[i] = tri;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aTarget', new THREE.BufferAttribute(tgt, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(aSeed, 1));
  g.setAttribute('aSize', new THREE.BufferAttribute(aSize, 1));
  g.setAttribute('aTri', new THREE.BufferAttribute(aTri, 1));
  markU = {
    uProgress: { value: 0 }, uTime: { value: 0 }, uAlpha: { value: 0 },
    uPointScale: { value: 0.2 * (tier === 'mobile' ? 0.5 : 1) }, uViewScale: { value: viewScale },
    uColorA: { value: C(0x4977ff) }, uColorB: { value: C(0xd2bdff) }
  };
  const m = new THREE.ShaderMaterial({
    uniforms: markU, vertexShader: MARK_VERT, fragmentShader: MARK_FRAG,
    blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, transparent: true
  });
  markPts = new THREE.Points(g, m);
  markPts.frustumCulled = false;
  markGroup.add(markPts);

  // background motes — a loose cloud behind the mark
  const mn = MOTE_COUNT;
  const mpos = new Float32Array(mn * 3), mseed = new Float32Array(mn);
  for (let i = 0; i < mn; i++) {
    mpos[i * 3] = (Math.random() - 0.5) * 90;
    mpos[i * 3 + 1] = (Math.random() - 0.5) * 90;
    mpos[i * 3 + 2] = -6 - Math.random() * 46;
    mseed[i] = Math.random();
  }
  const mg = new THREE.BufferGeometry();
  mg.setAttribute('position', new THREE.BufferAttribute(mpos, 3));
  mg.setAttribute('aSeed', new THREE.BufferAttribute(mseed, 1));
  moteU = {
    iTime: { value: 0 }, uAlpha: { value: 0 }, uViewScale: { value: viewScale }, uColor: { value: C(accent400) }
  };
  const mm = new THREE.ShaderMaterial({
    uniforms: moteU, vertexShader: DUST_VERT, fragmentShader: DUST_FRAG,
    blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, transparent: true
  });
  motePts = new THREE.Points(mg, mm);
  motePts.frustumCulled = false;
  markGroup.add(motePts);
}

function buildWarp() {
  const n = 1400;
  const pos = new Float32Array(n * 4 * 3);
  const aSeed = new Float32Array(n * 4), aSpeed = new Float32Array(n * 4),
        aRadius = new Float32Array(n * 4), aAngle = new Float32Array(n * 4),
        aEnd = new Float32Array(n * 4), aSide = new Float32Array(n * 4);
  const idx = new Uint32Array(n * 6);
  for (let i = 0; i < n; i++) {
    const seed = Math.random(), speed = 0.5 + 0.9 * Math.random(),
          radius = 0.35 + 9 * Math.sqrt(Math.random()), angle = Math.random() * TAU;
    for (let v = 0; v < 4; v++) {
      const j = i * 4 + v;
      aSeed[j] = seed; aSpeed[j] = speed; aRadius[j] = radius; aAngle[j] = angle;
      aEnd[j] = v < 2 ? 0 : 1;             // 0 tail -> 1 head
      aSide[j] = (v % 2 === 0) ? -1 : 1;   // across width
    }
    const b = i * 4, q = i * 6;
    idx[q] = b; idx[q + 1] = b + 2; idx[q + 2] = b + 1;
    idx[q + 3] = b + 2; idx[q + 4] = b + 3; idx[q + 5] = b + 1;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(aSeed, 1));
  g.setAttribute('aSpeed', new THREE.BufferAttribute(aSpeed, 1));
  g.setAttribute('aRadius', new THREE.BufferAttribute(aRadius, 1));
  g.setAttribute('aAngle', new THREE.BufferAttribute(aAngle, 1));
  g.setAttribute('aEnd', new THREE.BufferAttribute(aEnd, 1));
  g.setAttribute('aSide', new THREE.BufferAttribute(aSide, 1));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  warpU = {
    iTime: { value: 0 }, uBoost: { value: 0 }, uSurge: { value: 0 },
    uSpread: { value: Math.max(1, innerWidth / innerHeight) }, uWidth: { value: 2.2 },
    uResolution: { value: new THREE.Vector2(innerWidth, innerHeight) },
    uOpacity: { value: 0 },
    uHead: { value: C(accent300) }, uTail: { value: C(accent700) }, uPink: { value: C(signalGlow) }
  };
  const m = new THREE.ShaderMaterial({
    uniforms: warpU, vertexShader: WARP_VERT, fragmentShader: WARP_FRAG,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthTest: false, transparent: true
  });
  warpMesh = new THREE.Mesh(g, m);
  warpMesh.frustumCulled = false;
  camera.add(warpMesh); // rides in front of the moving lens
}

/* ---------------- scene init ---------------- */
try {
  renderer = new THREE.WebGLRenderer({
    canvas: $('scene'), antialias: tier !== 'mobile', powerPreference: 'high-performance'
  });
  renderer.setClearColor(0x02040d, 1);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x02040d);
  camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 600);
  camera.position.set(0, 0, 15);
  scene.add(camera);

  buildMorph();
  buildStarfield();
  buildMark();
  buildWarp();

  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0, 0.4, 0.85);
  bloomPass.enabled = false; // strength 0 = inert — the clouds fake their own glow
  composer.addPass(bloomPass);
  finalPass = new ShaderPass({
    uniforms: {
      tDiffuse: { value: null }, iTime: { value: 0 },
      iCornerLow: { value: C(accent900) }, iCornerHigh: { value: C(accent700) },
      uSpread: { value: 0.28 }, uIntensity: { value: 2.6 }
    },
    vertexShader: FINAL_VERT, fragmentShader: FINAL_FRAG
  });
  composer.addPass(finalPass);
} catch (err) {
  renderer = null;
  sceneWrap.style.display = 'none';
  console.error('WebGL unavailable:', err);
}

/* ---------------- per-frame camera + uniforms ---------------- */
const uniEye = new THREE.Vector3(), burstEye = new THREE.Vector3(), maelEye = new THREE.Vector3();
const uniLook = new THREE.Vector3(), burstLook = new THREE.Vector3(), maelLook = new THREE.Vector3();
const eye = new THREE.Vector3(), look = new THREE.Vector3();
const ndcV = new THREE.Vector3(), rayDir = new THREE.Vector3(), pWorld = new THREE.Vector3(), fwd = new THREE.Vector3();

const UNI_BLOOM = [1.5, 0.5, 2.4, 0.6, 1, 1.5];
const BURST_BLOOM = [1.7, 0.34, 3, 0.3, 1, 1.9];
const MAEL_BLOOM = [1.35, 0.4, 2.8, 0.38, 1, 1.9];
const UNI_PTR = { radius: 3.4, push: 0.42, swirl: 0.75, glow: 1.1 };
const BURST_PTR = { radius: 3.6, push: 0.5, swirl: 0.95, glow: 1.3 };
const MAEL_PTR = { radius: 10, push: 1.3, swirl: 2.2, glow: 0.9 };

function appearAmt(now) {
  if (!loaded) return 0;
  return cubicOut(clamp01((now - appearStart) / 1800));
}
function sceneTime(now) {
  const t = (now - startTime) / 1000;
  if (reduced && loaded && (now - appearStart) > 1800) {
    if (frozenTime === null) frozenTime = t;
    return frozenTime;
  }
  return t;
}

function updateScene(now) {
  const st = scrollState;
  const t = sceneTime(now);
  const appear = appearAmt(now);

  /* --- camera flight --- */
  const dive = st.s1;
  const uAngle = Math.sin(t * 0.035) * 0.16;
  const uDist = 10.5 - 3.5 * dive;
  uniEye.set(Math.sin(uAngle) * uDist, Math.sin(t * 0.05) * 2.2, Math.cos(uAngle) * uDist);
  uniLook.set(0, 0, 0);

  const orbit = st.burstPhase * 2.6 + Math.sin(t * 0.05) * 0.09 + pointer.x * 0.6 * pointer.active;
  const bDist = 11 + 1.8 * st.burstPhase;
  burstEye.set(Math.sin(orbit) * bDist, 2 + 6 * st.burstPhase, Math.cos(orbit) * bDist);
  burstLook.set(0, 0, 0);

  const onAxis = smoothstep(0, 0.65, st.exit);
  const through = Math.pow(smoothstep(0.15, 1, st.exit), 3);
  const ahead = smoothstep(0.12, 0.5, st.exit);
  const pass = smoothstep(0, 1, st.tlp);
  const swing = pass * 2.6;
  const mRadius = lerp(26, 28, pass) * (1 - onAxis);
  const eyeZ = 14 - 36 * through; // 14 -> -22 along the disc axis
  const ew = fromDiscFrame(Math.cos(swing) * mRadius, Math.sin(swing) * mRadius, eyeZ);
  maelEye.set(ew[0], ew[1], ew[2]);
  const lw = fromDiscFrame(0, 0, (eyeZ - 40) * ahead);
  maelLook.set(lw[0], lw[1], lw[2]);
  const maelFov = lerp(lerp(66, 76, pass), 104, through);

  eye.copy(uniEye).lerp(burstEye, st.t1).lerp(maelEye, st.t2);
  look.copy(uniLook).lerp(burstLook, st.t1).lerp(maelLook, st.t2);
  let fov = lerp(lerp(58, 62, st.t1), maelFov, st.t2);
  const px = lerp(lerp(0.6, 0, st.t1), 8.85, st.t2);
  const py = lerp(lerp(0.6, 2.2, st.t1), 7.08, st.t2);
  const held = pointer.active * (1 - smoothstep(0, 0.5, st.exit));
  eye.x += pointer.x * px * held;
  eye.y += pointer.y * py * held;
  eye.z += (1 - appear) * 8; // entrance dolly

  camera.position.copy(eye);
  camera.fov = fov;
  camera.updateProjectionMatrix();
  camera.lookAt(look);
  camera.updateMatrixWorld();

  /* --- pointer as a body in the scene --- */
  if (pointer.active) {
    ndcV.set(pointer.x, pointer.y, 0.5).unproject(camera);
    rayDir.copy(ndcV).sub(camera.position).normalize();
    const lookDist = camera.position.distanceTo(look) || 10;
    pWorld.copy(camera.position).addScaledVector(rayDir, lookDist);
    morphU.uPointer.value.copy(pWorld);
  }
  camera.getWorldDirection(fwd);
  morphU.uPointerAxis.value.copy(fwd);
  const t1 = st.t1, t2 = st.t2;
  morphU.uPointerR.value = lerp(lerp(UNI_PTR.radius, BURST_PTR.radius, t1), MAEL_PTR.radius, t2);
  morphU.uPointerPush.value = lerp(lerp(UNI_PTR.push, BURST_PTR.push, t1), MAEL_PTR.push, t2) * pointer.active;
  morphU.uPointerSwirl.value = lerp(lerp(UNI_PTR.swirl, BURST_PTR.swirl, t1), MAEL_PTR.swirl, t2) * pointer.active;
  morphU.uPointerGlow.value = lerp(lerp(UNI_PTR.glow, BURST_PTR.glow, t1), MAEL_PTR.glow, t2) * pointer.active;

  /* --- morph cloud --- */
  const dissolve = smoothstep(0.15, 0.9, st.logoAmt);
  morphU.iTime.value = t;
  morphU.uUniTime.value = t + 6; // prime the galaxy one lifetime
  morphU.uT1.value = t1;
  morphU.uT2.value = t2;
  morphU.uNeedUni.value = t1 < 1 ? 1 : 0;
  morphU.uNeedBurst.value = (t1 > 0 && t2 < 1) ? 1 : 0;
  morphU.uNeedMael.value = t2 > 0 ? 1 : 0;
  morphU.uMaelPhase.value = st.tlp;
  morphU.uAlpha.value = appear * (1 - dissolve);
  for (let i = 0; i < 6; i++) {
    const v = lerp(lerp(UNI_BLOOM[i], BURST_BLOOM[i], t1), MAEL_BLOOM[i], t2);
    if (i === 0) morphU.uCoreStrength.value = v;
    else if (i === 1) morphU.uCoreSize.value = v;
    else if (i === 2) morphU.uCoreSharp.value = v;
    else if (i === 3) morphU.uHaloAmount.value = v;
    else if (i === 4) morphU.uHaloWidth.value = v;
    else morphU.uHaloFalloff.value = v;
  }

  /* --- starfield & dust --- */
  starU.iTime.value = t;
  starU.uAlpha.value = Math.min(1, appear * 1.4); // stars slightly lead
  dustU.iTime.value = t;
  dustU.uAlpha.value = appear;

  /* --- logo mark, 10 units in front of the camera, facing it --- */
  markGroup.visible = st.logoAmt > 0.001;
  if (markGroup.visible) {
    markGroup.position.copy(camera.position).addScaledVector(fwd, 10);
    markGroup.quaternion.copy(camera.quaternion);
    markGroup.rotateY(pointer.x * 0.08 * pointer.active);
    markGroup.rotateX(-pointer.y * 0.06 * pointer.active);
    markU.uProgress.value = st.logoAmt;
    markU.uTime.value = t;
    markU.uAlpha.value = clamp01(st.logoAmt * 1.6) * 3;
    moteU.iTime.value = t;
    moteU.uAlpha.value = st.logoAmt;
  }

  /* --- warp preloader --- */
  if (warpMesh && !warpDead) {
    warpU.iTime.value = t;
    warpU.uBoost.value = loadP;
    if (!loaded) {
      warpU.uOpacity.value = Math.min(1, (now - startTime) / 500);
    } else {
      const k = Math.min(1, (now - warpDestroyStart) / 650);
      warpU.uSurge.value = k;
      warpU.uOpacity.value = Math.pow(1 - k, 3);
      if (k >= 1) {
        warpDead = true;
        camera.remove(warpMesh);
        warpMesh.geometry.dispose();
        warpMesh.material.dispose();
        warpMesh = null;
      }
    }
  }

  finalPass.uniforms.iTime.value = t;
  composer.render();
}

/* ---------------- resize ---------------- */
function onResize() {
  layoutFrames();
  measure();
  if (!renderer) return;
  const w = innerWidth, h = innerHeight;
  viewScale = Math.min(1, Math.max(0.5, h / 1080));
  const dpr = window.devicePixelRatio || 1;
  const pr = tier === 'mobile' ? Math.min(dpr, 0.85) : Math.min(1.5, Math.max(0.75, dpr));
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h);
  composer.setPixelRatio(pr);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  morphU.uRes.value.set(w * pr, h * pr);
  morphU.uUniSize.value = 70 * viewScale;
  morphU.uBurstSize.value = 44 * 1.55 * viewScale;
  morphU.uMaelSize.value = 62 * 1.55 * viewScale;
  starU.uViewScale.value = viewScale;
  dustU.uViewScale.value = viewScale;
  markU.uViewScale.value = viewScale;
  moteU.uViewScale.value = viewScale;
  if (warpU) {
    warpU.uSpread.value = Math.max(1, w / h);
    warpU.uResolution.value.set(w, h);
  }
}
addEventListener('resize', onResize);

/* ---------------- load / reveal ---------------- */
const loaderEl = $('loader'), pctNum = $('pct-num'), loadFill = $('load-fill');
function finishLoad(now) {
  loaded = true;
  appearStart = now;
  warpDestroyStart = now;
  pctNum.textContent = '100';
  loadFill.style.transform = 'scaleX(1)';
  if (reduced) { loaderEl.remove(); }
  else {
    tween({ dur: 450, ease: easeReveal, update: e => { loaderEl.style.opacity = (1 - e).toFixed(3); }, done: () => loaderEl.remove() });
  }
  revealNav();
  latched.hero = true;
  revealHero();
}

/* ---------------- main loop ---------------- */
let lastFrame = 0, lastRender = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(64, now - (lastFrame || now));
  lastFrame = now;

  if (lenis) lenis.raf(now);
  stepTweens(now);
  stepSprings(dt);

  /* fake load 0 -> 100 */
  if (!loaded) {
    loadP = Math.min(1, (now - startTime) / (reduced ? 600 : 1800));
    pctNum.textContent = String(Math.round(loadP * 100));
    railV += (loadP - railV) * 0.18;
    loadFill.style.transform = `scaleX(${railV.toFixed(4)})`;
    if (loadP >= 0.98) finishLoad(now);
  }

  /* section controller — measured tops -> weights */
  const y = window.scrollY, vh = innerHeight;
  const st = scrollState;
  if (rects.hero) {
    st.s1 = clamp01((y - rects.hero.top) / (rects.sitemap.top - rects.hero.top));
    st.s2 = clamp01((y - rects.sitemap.top) / (rects.timeline.top - rects.sitemap.top));
    st.t1 = smoothstep(0.25, 1, st.s1);            // morph1Start = 0.25
    st.t2 = smoothstep(0.30, 0.95, st.s2);         // morph2Start = 0.30, morph2End = 0.95
    st.dive = st.s1;
    const burstBegins = rects.hero.top + 0.25 * (rects.sitemap.top - rects.hero.top);
    st.burstPhase = clamp01((y - burstBegins) / (rects.timeline.top - burstBegins));
    st.tlp = clamp01((y - rects.timeline.top) / Math.max(1, rects.timeline.height - vh));
    st.exit = clamp01((y + 2 * vh - rects.impact.top) / (2.4 * vh));
    st.logoAmt = clamp01((y - rects.impact.top + vh * 0.35) / (vh * 1.3));
    st.active = !loaded ? 'none'
      : st.logoAmt > 0.05 ? 'impact'
      : st.s2 > 0.55 ? 'timeline'
      : st.s1 > 0.55 ? 'sitemap'
      : 'hero';
  }

  /* DOM fades (scene-fade per pinned overlay) */
  const heroFade = loaded ? 1 - smoothstep(0.35, 0.7, st.s1) : 0;
  const svcFade = loaded ? smoothstep(0.5, 0.85, st.s1) * (1 - smoothstep(0.5, 0.85, st.s2)) : 0;
  const tlFade = loaded ? smoothstep(0.6, 0.95, st.s2) * (1 - smoothstep(0.2, 0.55, st.exit)) : 0;
  const impFade = loaded ? smoothstep(0.08, 0.35, st.logoAmt) : 0;
  setOverlay(ovHero, heroFade, -smoothstep(0.35, 0.7, st.s1) * 50);
  setOverlay(ovServices, svcFade, -smoothstep(0.5, 0.85, st.s2) * 60);
  setOverlay(ovTimeline, tlFade, 0);
  setOverlay(ovImpact, impFade, 0);

  if (loaded && !latched.services && svcFade > 0.05) { latched.services = true; revealServices(); }
  if (loaded && !latched.timeline && tlFade > 0.05) { latched.timeline = true; revealTimeline(); }
  if (loaded && !latched.impact && impFade > 0.02) { latched.impact = true; revealImpact(); }

  /* roadmap rail travel (right-to-left) */
  tlTrack.style.transform = `translateX(${(-st.tlp * TL_TRAVEL).toFixed(2)}px)`;
  if (tlmOverflow > 0) $('tlm-list').style.transform = `translateY(${(-st.tlp * tlmOverflow).toFixed(2)}px)`;

  /* hero icon spin — outer 16000ms, inner 9000ms, clockwise */
  if (!reduced) {
    triOuterEl.style.transform = `rotate(${((now % 16000) / 16000 * 360).toFixed(3)}deg)`;
    triInnerEl.style.transform = `rotate(${((now % 9000) / 9000 * 360).toFixed(3)}deg)`;
  }

  /* canvas wrapper fade across the last slide */
  let canvasOp = 1;
  if (rects.impact) canvasOp = 1 - smoothstep(0, 1, clamp01((y - rects.impact.top) / Math.max(1, rects.impact.height - vh)));
  sceneWrap.style.opacity = canvasOp.toFixed(3);
  sceneWrap.style.visibility = canvasOp > 0.002 ? 'visible' : 'hidden';

  /* render (frame-capped on phones/tablets; skip when faded out or hidden) */
  if (renderer && canvasOp > 0.002 && !document.hidden) {
    if (!FRAME_INTERVAL || now - lastRender >= FRAME_INTERVAL) {
      lastRender = now;
      updateScene(now);
    }
  }
}

layoutFrames();
measure();
onResize();
requestAnimationFrame(loop);
</script>
</body>
</html>
